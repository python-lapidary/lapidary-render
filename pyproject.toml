[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.2.1"]

[project]
authors = [{ name = "Rafał Krupiński", email = "rafal@lapidary.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "click~=8.2",
    "httpx~=0.28.0",
    "libcst~=1.8",
    "openapi-pydantic~=0.5",
    "pybase62~=1.0",
    "pydantic~=2.0",
    "python-mimeparse~=2.0",
    "ruamel-yaml~=0.19",
    "tomli-w~=1.0",
]
description = "Python async OpenAPI client library generator"
keywords = [
    "Code Generation",
    "Code Generator",
    "CodeGen",
    "OpenAPI Tools",
    "OpenAPI",
    "OpenAPI3",
]
license = "AGPL-3.0"
name = "lapidary-render"
readme = "Readme.md"
requires-python = "~=3.12"
version = "0.12.1"

[project.urls]
Homepage = "https://lapidary.dev/"

[project.scripts]
lapidary-render = "lapidary_render:app"

[dependency-groups]
dev = [
    "pre-commit~=4.0",
    "pytest~=9.0",
    "pytest-asyncio~=1.0",
    "pytest-httpx~=0.36.0",
    "mypy~=1.19",
]

docs = [
    "markdown-callouts~=0.4.0",
    "markdown-exec~=1.11",
    "mkdocs-llmstxt>=0.3.2,<0.6.0",
    "mkdocs-material~=9.6",
    "mkdocs-minify-plugin~=0.8.0",
    "mkdocs-section-index~=0.3.10",
    "mkdocstrings[python]>=0.30.1,<1.1.0",
    "mkdocs~=1.6",
]

[tool.mypy]
exclude = ["tests/e2e"]
ignore_missing_imports = true
mypy_path = "src"
namespace_packages = true
packages = ['lapidary_render']
python_version = "3.12"

[tool.pytest.ini_options]
addopts = "--color=yes"
asyncio_default_fixture_loop_scope = 'function'
log_cli = true
norecursedirs = ['tests/e2e']
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["tests/e2e"]
line-length = 120
src = ["src"]
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-ignore = [
    'F401', 'F403', 'F405',
    'UP040', 'UP008',
]
extend-select = ['I', 'UP']

[tool.ruff.lint.isort]
combine-as-imports = true
